services:
  - type: web
    name: bulk-whatsapp-sender
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite+aiosqlite:////tmp/bulk.db
    disk:
      name: sqlite
      mountPath: /tmp
      sizeGB: 1
