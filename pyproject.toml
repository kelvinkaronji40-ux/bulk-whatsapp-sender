[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "bulk-whatsapp-sender"
version = "0.1.0"
description = "Bulk WhatsApp sender with campaigns, contacts, CSV upload, queue, and status tracking."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.19",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "python-dotenv>=1.0",
    "pydantic>=2.0",
]

[project.scripts]
bulk-whatsapp = "cli.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "cli*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
