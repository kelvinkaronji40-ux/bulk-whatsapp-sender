<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Campaigns — Bulk WhatsApp Sender</title>
  <style>
    :root { --bg:#0f172a; --surface:#1e293b; --surface2:#334155; --text:#f8fafc; --muted:#94a3b8; --accent:#0ea5e9; }
    body { font-family: Inter, system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; }
    header { padding: 16px 20px; border-bottom: 1px solid #334155; display:flex; justify-content:space-between; align-items:center; }
    main { padding: 20px; max-width: 980px; margin: 0 auto; }
    .toolbar { display:flex; gap:10px; flex-wrap:wrap; margin: 14px 0; }
    .btn { background: var(--accent); color:#fff; border:0; padding:10px 14px; border-radius:10px; cursor:pointer; font-weight:600; }
    .btn-secondary { background: var(--surface2); }
    .card { background: var(--surface); border: 1px solid #334155; border-radius: 14px; padding: 18px; margin: 12px 0; }
    .muted { color: var(--muted); }
    .hidden { display:none; }
    input, textarea, select { background: var(--surface); color: var(--text); border:1px solid #334155; padding:10px; border-radius:10px; width: 100%; }
    textarea { min-height: 120px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 style="margin:0;font-size:18px;">Campaigns</h1>
      <p class="muted" style="margin:4px 0 0;">Create, schedule, and send WhatsApp campaigns</p>
    </div>
    <nav>
      <a href="/">Dashboard</a>
      &nbsp;|&nbsp;
      <a href="/static/index.html">Contacts</a>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <button class="btn" id="new">+ New Campaign</button>
    </div>
    <div class="card hidden" id="form">
      <h3>New Campaign</h3>
      <div style="display:grid;gap:10px;margin-top:10px;">
        <input id="name" placeholder="Campaign name" />
        <textarea id="body" placeholder="Message body"></textarea>
        <input id="template" placeholder="Optional template name" />
      </div>
      <div class="toolbar" style="margin-top:12px;">
        <button class="btn" id="save">Save</button>
        <button class="btn btn-secondary" id="cancel">Cancel</button>
      </div>
    </div>
    <div id="list"></div>
    <footer style="padding:18px 24px;text-align:center;color:#94a3b8;font-size:12px;border-top:1px solid #334155;margin-top:24px;">
      Powered by <a href="https://tisementmedia.com" target="_blank" style="color:#0ea5e9;text-decoration:none;">Tisement Media</a> • Bulk WhatsApp Sender
    </footer>
  </main>
  <script>
    async function load() {
      const res = await fetch('/campaigns/');
      const items = await res.json();
      document.getElementById('list').innerHTML = items.map(c => `
        <div class="card">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div>
              <h3 style="margin:0;">${escape(c.name)}</h3>
              <p class="muted" style="margin:6px 0 0;">Status: ${escape(c.status)}${c.template_name ? ' • Template: '+escape(c.template_name) : ''}</p>
            </div>
            <div style="display:flex;gap:8px;">
              <button class="btn" onclick="sendCampaign(${c.id})">Send</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    function escape(s){ if(typeof s!=='string') return ''; return s.replace(/[&<>'"]/g, m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','\'':'&#39;','"':'&quot;' }[m])); }
    document.getElementById('new').onclick = () => document.getElementById('form').classList.remove('hidden');
    document.getElementById('cancel').onclick = () => document.getElementById('form').classList.add('hidden');
    document.getElementById('save').onclick = async () => {
      const payload = { name: document.getElementById('name').value, body_text: document.getElementById('body').value, template_name: document.getElementById('template').value || null };
      await fetch('/campaigns/', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(payload) });
      document.getElementById('form').classList.add('hidden');
      load();
    };
    window.sendCampaign = async (id) => {
      const res = await fetch(`/campaigns/${id}/send`, { method:'POST' });
      const data = await res.json();
      alert(`Sent: ${data.sent}, Failed: ${data.failed}, Skipped: ${data.skipped}`);
      load();
    };
    document.addEventListener('DOMContentLoaded', load);
  </script>
</body>
</html>
